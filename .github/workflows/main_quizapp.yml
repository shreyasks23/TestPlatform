name: Build and deploy ASP.NET Core app to Azure Web App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Restore
        run: dotnet restore TestPlatform.slnx
      - name: Test
        run: dotnet test TestPlatform.slnx --configuration Release --no-restore
      - name: Build API
        run: dotnet build TestPlatform.Api/TestPlatform.Api.csproj --configuration Release --no-restore
      - name: Publish API
        run: dotnet publish TestPlatform.Api/TestPlatform.Api.csproj -c Release --no-restore -o "${{ env.DOTNET_ROOT }}/myapp"
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    if: github.event_name == 'push'
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dotnet-app
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_79F58E85C6A34853B6815917D64C0758 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C3F045332B1540AAB4B8A049B85CAC33 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E8E986089AAD4A2495BEACB3CB6A93E5 }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: quizapp
          slot-name: Production
          package: .

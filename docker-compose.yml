services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: TestPlatformDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TestPlatformDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: TestPlatform.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__TestPlatformDatabase: Host=postgres;Port=5432;Database=TestPlatformDb;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:4173
    ports:
      - "5209:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: ../TestPlatform.UI
      dockerfile: Dockerfile
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  postgres-data:
